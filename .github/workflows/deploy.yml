name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  ci:
    name: Run CI Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    name: Deploy to Oracle A1
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy backend via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 132.145.70.153
          username: ubuntu
          key: ${{ secrets.A1_SSH_KEY }}
          port: 22
          timeout: 10m
          command_timeout: 10m
          script: |
            bash /home/ubuntu/teenovatex/backend/ops/deploy.sh
